<script>
"use strict";
/* ============================================================
   VUE GRAPHIQUE — évolution du solde
   Argent / jour (dates) ou Argent / transactions, intervalle au choix
   ============================================================ */
function rangeOfInterval(preset, base){
  const now = base || new Date();
  const mk = (d) => (d ? d.getTime() : -Infinity);
  switch(preset){
    case '7d':  return { from: mk(new Date(now.getTime() - 7*86400000)), to: mk(now) };
    case '1m':  { const d = new Date(now); d.setMonth(d.getMonth()-1); return { from: mk(d), to: mk(now) }; }
    case '3m':  { const d = new Date(now); d.setMonth(d.getMonth()-3); return { from: mk(d), to: mk(now) }; }
    case '6m':  { const d = new Date(now); d.setMonth(d.getMonth()-6); return { from: mk(d), to: mk(now) }; }
    case '1y':  { const d = new Date(now); d.setFullYear(d.getFullYear()-1); return { from: mk(d), to: mk(now) }; }
    case 'all': return { from: mk(null), to: mk(now) };
    case 'custom': {
      const f = chartSettings.customFrom ? new Date(chartSettings.customFrom + 'T00:00:00').getTime() : mk(null);
      const t = chartSettings.customTo ? new Date(chartSettings.customTo + 'T23:59:59').getTime() : mk(now);
      return { from: f, to: t };
    }
    default: return { from: mk(new Date(now.getTime() - 30*86400000)), to: mk(now) };
  }
}
function scopedTxns(scope){
  if (scope === 'all') return allTxns();
  return walletList().filter(w=>w.id===appState.currentWallet).flatMap(w => w.transactions.map(t => ({ ...t, walletId:w.id, walletEmoji:w.emoji, walletName:w.name })));
}
function renderChartView(){
  const cs = chartSettings;
  const chips = (list, cur, fn) => list.map(p => `<button class="chip ${cur===p.id?'active':''}" onclick="${fn}('${p.id}')">${p.label}</button>`).join('');
  const customDates = cs.interval==='custom' ? `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
      <div><label class="lbl">Du</label><input type="date" class="inp" id="chart-from" value="${cs.customFrom}" onchange="setChartCustom('from',this.value)"></div>
      <div><label class="lbl">Au</label><input type="date" class="inp" id="chart-to" value="${cs.customTo}" onchange="setChartCustom('to',this.value)"></div>
    </div>` : '';
  const customN = cs.interval === 'customTx' ? `
    <div style="display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px">
      <div><label class="lbl">Nombre de transactions</label><input type="number" min="1" class="inp" id="chart-n" value="${cs.customN}" placeholder="ex : 25" onchange="setChartCustom('n',this.value)"></div>
    </div>` : '';
  const cur = current();
  return `
  <div class="view-anim">
  <div class="card">
    <h2 class="card-title"><span class="em">📊</span> Évolution du solde</h2>
    <div class="seg" style="margin-bottom:12px">
      <button class="${cs.mode==='date'?'active':''}" onclick="setChartMode('date')">📅 Par jour</button>
      <button class="${cs.mode==='tx'?'active':''}" onclick="setChartMode('tx')">🔢 Par transaction</button>
    </div>
    <label class="lbl">Périmètre</label>
    <div class="chip-row" style="margin-bottom:14px">
      <button class="chip ${cs.scope==='wallet'?'active':''}" onclick="setChartScope('wallet')">👛 ${cur ? esc(cur.name) : 'Wallet'}</button>
      <button class="chip ${cs.scope==='all'?'active':''}" onclick="setChartScope('all')">🌍 Tous les wallets</button>
    </div>
    ${cs.mode==='date' ? `
    <label class="lbl">Intervalle</label>
    <div class="chip-row" style="flex-wrap:wrap">${chips(MONTH_PRESETS, cs.interval, 'setChartInterval')}</div>
    ${customDates}` : `
    <label class="lbl">Intervalle</label>
    <div class="chip-row" style="flex-wrap:wrap">${chips(TX_PRESETS, cs.interval, 'setChartInterval')}</div>
    ${customN}`}
  </div>
  <div class="card">
    <div class="chart-wrap" id="chart-wrap">
      <div id="chart-tip"></div>
    </div>
    <div class="chart-stats" id="chart-stats-row"></div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-ghost" style="flex:1" onclick="exportChartPNG()">⬇️ PNG</button>
    <button class="btn btn-primary" style="flex:1" onclick="go('wrapped')">🎁 Faire un Wrapped</button>
  </div>
  </div>`;
}
function setChartMode(m){ chartSettings.mode = m; chartSettings.interval = m==='date' ? '1m' : '20'; persistUI(); renderView(); }
function setChartScope(s){ chartSettings.scope = s; persistUI(); renderView(); }
function setChartInterval(p){
  if (p === 'custom' && chartSettings.mode==='date'){ chartSettings.interval = 'custom'; persistUI(); renderView(); return; }
  if (p === 'custom' && chartSettings.mode==='tx'){ chartSettings.interval = 'customTx'; persistUI(); renderView(); return; }
  chartSettings.interval = p; persistUI(); renderView();
}
function setChartCustom(which, v){
  if (which==='from') chartSettings.customFrom = v;
  if (which==='to') chartSettings.customTo = v;
  if (which==='n') chartSettings.customN = v;
  persistUI(); requestAnimationFrame(()=>drawChart());
}
function persistUI(){
  if (!appState) return;
  appState.ui.chart = chartSettings; appState.ui.wrapped = wrappedSettings; appState.ui.hist = histSettings;
  saveData();
}

/* ---------- Dessin SVG ---------- */
let chartPts = [], chartBox = null;
function niceTicks(min, max, n){
  if (!isFinite(min) || !isFinite(max)) return [0, 1];
  const span = max - min || 1;
  const step0 = span / Math.max(1, n);
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const norm = step0 / mag;
  const step = (norm >= 5 ? 10 : norm >= 2 ? 5 : norm >= 1 ? 2 : 1) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const out = [];
  for (let v = lo; v <= hi + step/2; v += step) out.push(v);
  return out;
}
function drawChart(){
  const wrap = document.getElementById('chart-wrap'); if (!wrap) return;
  const cs = chartSettings;
  const txns = scopedTxns(cs.scope);
  let opts;
  if (cs.mode === 'tx'){
    const count = cs.interval==='customTx' ? (Number(cs.customN)||20) : (cs.interval==='all' ? 'all' : Number(cs.interval));
    opts = { mode:'tx', count };
  } else {
    const r = rangeOfInterval(cs.interval);
    opts = { mode:'date', from:r.from, to:r.to };
  }
  const series = computeSeries(txns, opts);
  chartData = series;
  const W = Math.max(280, wrap.clientWidth || 340), H = 240;
  const padL = 46, padR = 12, padT = 16, padB = 26;
  const iw = W - padL - padR, ih = H - padT - padB;
  const pts = series.points;
  wrap.querySelector('svg')?.remove();
  wrap.insertAdjacentHTML('afterbegin', `<svg id="chart-svg" width="${W}" height="${H}" style="display:block"></svg>`);

  const svg = document.getElementById('chart-svg');
  const ns = 'http://www.w3.org/2000/svg';
  const good = getComputedStyle(document.documentElement).getPropertyValue('--good').trim() || '#34D399';
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#8B5CF6';
  const surfC = getComputedStyle(document.documentElement).getPropertyValue('--surface').trim() || '#241343';
  const softC = 'rgba(235,235,245,.38)';

  const statsRow = document.getElementById('chart-stats-row');
  if (!pts.length){
    svg.innerHTML = '';
    statsRow.innerHTML = `<div class="empty" style="width:100%"><span class="e">📉</span>Aucune opération sur cette période.<br><span class="faint">Élargis l'intervalle ou ajoute des transactions.</span></div>`;
    return;
  }
  let xs, ys;
  if (cs.mode === 'date'){
    const from = pts[0].t.timestamp, to = pts[pts.length-1].t.timestamp;
    xs = pts.map(p => padL + (from===to ? iw/2 : ((p.t.timestamp - from) / (to - from)) * iw));
  } else {
    if (pts.length === 1) xs = [padL + iw/2];
    else xs = pts.map((p,i) => padL + (i/(pts.length-1)) * iw);
  }
  let minV = Math.min(series.startBal, ...pts.map(p=>p.y));
  let maxV = Math.max(series.startBal, ...pts.map(p=>p.y));
  const span0 = maxV - minV;
  minV -= span0*0.12 || 1; maxV += span0*0.12 || 1;
  ys = pts.map(p => padT + (1 - (p.y - minV) / (maxV - minV)) * ih);
  const y0 = padT + (1 - (0 - minV) / (maxV - minV)) * ih;

  // ticks Y
  const ticks = niceTicks(minV, maxV, 4);
  let g = '';
  ticks.forEach(t => {
    const yy = padT + (1 - (t - minV) / (maxV - minV)) * ih;
    g += `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="rgba(235,235,245,.07)" stroke-width="1"/>`;
    g += `<text x="${padL-8}" y="${yy+3.5}" text-anchor="end" font-size="9.5" fill="${softC}">${fmtCompact(t)}</text>`;
  });
  // ligne zéro
  if (0 >= minV && 0 <= maxV)
    g += `<line x1="${padL}" y1="${y0}" x2="${W-padR}" y2="${y0}" stroke="rgba(235,235,245,.22)" stroke-width="1" stroke-dasharray="4 4"/>`;
  // ticks X
  const xTicks = [];
  if (cs.mode === 'date'){
    const f = pts[0].t.timestamp, t = pts[pts.length-1].t.timestamp;
    const n = Math.min(5, Math.max(2, Math.round(iw/90)));
    for (let i=0;i<n;i++) xTicks.push(f + (t-f) * (i/(n-1)));
    xTicks.push(t);
  } else {
    const n = Math.min(6, pts.length);
    if (n <= 1) xTicks.push(pts[0].x);
    else for (let i=0;i<n;i++) xTicks.push(pts[Math.round(i*(pts.length-1)/(n-1))].x);
  }
  xTicks.forEach(x => {
    const xx = cs.mode==='date'
      ? padL + ((x - pts[0].t.timestamp) / (pts[pts.length-1].t.timestamp - pts[0].t.timestamp || 1)) * iw
      : (()=>{ const idx = pts.findIndex(p=>p.x===x); return idx<0?null:padL+(idx/(pts.length-1 || 1))*iw; })();
    if (xx == null) return;
    g += `<text x="${Math.max(padL, Math.min(W-padR, xx))}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="${softC}">${fmtDayShort(x)}</text>`;
  });

  // courbe lissée (Catmull-Rom → bézier)
  const xy = pts.map((p,i)=>({ x:xs[i], y:ys[i] }));
  function pathFor(ps){
    if (ps.length < 2) return '';
    let d = `M ${ps[0].x} ${ps[0].y}`;
    for (let i=0;i<ps.length-1;i++){
      const p0 = ps[Math.max(0,i-1)], p1 = ps[i], p2 = ps[i+1], p3 = ps[Math.min(ps.length-1,i+2)];
      const c1x = p1.x + (p2.x - p0.x)/6, c1y = p1.y + (p2.y - p0.y)/6;
      const c2x = p2.x - (p3.x - p1.x)/6, c2y = p2.y - (p3.y - p1.y)/6;
      d += ` C ${c1x} ${c1y} ${c2x} ${c2y} ${p2.x} ${p2.y}`;
    }
    return d;
  }
  g += `<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${accent}" stop-opacity=".34"/>
        <stop offset="100%" stop-color="${accent}" stop-opacity="0"/></linearGradient></defs>`;
  if (xy.length >= 2){
    const linePath = pathFor(xy);
    const areaPath = linePath + ` L ${xy[xy.length-1].x} ${H-padB} L ${xy[0].x} ${H-padB} Z`;
    g += `<path d="${areaPath}" fill="url(#areaGrad)"/>`;
    g += `<path d="${linePath}" fill="none" stroke="${accent}" stroke-width="2.4" stroke-linecap="round"/>`;
  } else {
    g += `<circle cx="${xy[0].x}" cy="${xy[0].y}" r="5" fill="${accent}" opacity=".9" stroke="${surfC}" stroke-width="2"/>`;
  }
  // points
  const step = Math.max(1, Math.floor(pts.length / 160));
  pts.forEach((p,i) => {
    if (i % step !== 0 && i !== pts.length-1) return;
    g += `<circle cx="${xs[i]}" cy="${ys[i]}" r="${i===pts.length-1?3.6:2.4}" fill="${accent}" stroke="${surfC}" stroke-width="1.4"/>`;
  });
  svg.innerHTML = g;
  chartPts = pts.map((p,i)=>({ x:xs[i], y:ys[i], p }));
  chartBox = { padL, iw, W, H, padT, padB };

  // stats
  const delta = series.endBal - series.startBal;
  const pct = series.startBal !== 0 ? Math.abs(delta/series.startBal)*100 : 0;
  statsRow.innerHTML = `
    <div class="chart-stat"><div class="k">Début</div><div class="v tnum" style="color:var(--soft)">${fmtEUR(series.startBal)}</div></div>
    <div class="chart-stat"><div class="k">Variation</div><div class="v tnum" style="color:${delta>=0?'var(--good)':'var(--bad)'}">${fmtSigned(delta)}${series.startBal!==0?' · '+pct.toFixed(1)+'%':''}</div></div>
    <div class="chart-stat"><div class="k">Fin</div><div class="v tnum">${fmtEUR(series.endBal)}</div></div>`;

  // tooltip
  wrap.onmousemove = (ev) => {
    const rect = wrap.getBoundingClientRect();
    const mx = ev.clientX - rect.left;
    if (!chartPts.length) return;
    let best = 0, bd = Infinity;
    chartPts.forEach((pt,i)=>{ const d = Math.abs(pt.x - mx); if (d < bd){ bd = d; best = i; } });
    const pt = chartPts[best];
    const tip = document.getElementById('chart-tip');
    tip.style.display = 'block';
    tip.innerHTML = `<div class="t">${fmtDate(pt.p.t.timestamp)} · <span class="tnum" style="color:${pt.p.t.amount>=0?'var(--good)':'var(--bad)'}">${fmtSigned(pt.p.t.amount)}</span></div>
      <div class="s">${esc(pt.p.t.label || pt.p.t.type)}${pt.p.walletEmoji ? ' · '+pt.p.walletEmoji : ''} — solde <b class="tnum">${fmtEUR(pt.p.y)}</b></div>`;
    const leftPct = (pt.x / rect.width) * 100;
    tip.style.left = Math.min(86, Math.max(14, leftPct)) + '%';
    tip.style.top = (pt.y / rect.height) * 100 + '%';
    // point survolé
    const hl = document.getElementById('chart-hl');
    if (hl){ hl.setAttribute('cx', pt.x); hl.setAttribute('cy', pt.y); hl.style.display = ''; }
  };
  wrap.onmouseleave = () => {
    const tip = document.getElementById('chart-tip'); if (tip) tip.style.display = 'none';
    const hl = document.getElementById('chart-hl'); if (hl) hl.style.display = 'none';
  };
  if (!document.getElementById('chart-hl'))
    svg.insertAdjacentHTML('beforeend', `<circle id="chart-hl" r="5.5" fill="none" stroke="${good}" stroke-width="2.5" style="display:none" opacity=".9"/>`);
  const hl = document.getElementById('chart-hl');
  if (hl){ hl.setAttribute('cx', xs[pts.length-1]); hl.setAttribute('cy', ys[pts.length-1]); hl.style.display = 'none'; }
}
let resizeT = null;
window.addEventListener('resize', ()=>{ clearTimeout(resizeT); resizeT = setTimeout(()=>{ if (view==='chart') drawChart(); }, 180); });

function exportChartPNG(){
  const svg = document.getElementById('chart-svg'); if (!svg || !chartPts.length){ toast('⚠️ Rien à exporter pour l\'instant'); return; }
  try {
    const xml = new XMLSerializer().serializeToString(svg);
    const blob = new Blob([xml], { type:'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = ()=>{
      const W = svg.width.baseVal.value * 2, H = svg.height.baseVal.value * 2;
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const cx = cv.getContext('2d');
      cx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg1').trim();
      cx.fillRect(0,0,W,H);
      cx.drawImage(img, 0, 0, W, H);
      URL.revokeObjectURL(url);
      cv.toBlob(b => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b); a.download = 'bankling-graphique.png';
        document.body.appendChild(a); a.click(); a.remove();
        toast('📊 Graphique exporté en PNG');
      });
    };
    img.src = url;
  } catch(e){ toast('❌ Export impossible ici'); }
}
</script>

<script>
"use strict";
/* ============================================================
   VUE WRAPPED — bilan sur une période
   ============================================================ */
const WRAP_PRESETS = [
  {id:'today', label:'Aujourd\'hui'}, {id:'7d', label:'7 jours'}, {id:'1m', label:'1 mois'},
  {id:'3m', label:'3 mois'}, {id:'6m', label:'6 mois'}, {id:'1y', label:'1 an'}, {id:'all', label:'Tout'}, {id:'custom', label:'Personnalisé'}
];
function wrapRange(){
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  switch(wrappedSettings.interval){
    case 'today': return { from: todayStart, to: now.getTime() };
    case '7d': return { from: now.getTime() - 7*86400000, to: now.getTime() };
    case '1m': { const d=new Date(now); d.setMonth(d.getMonth()-1); return { from:d.getTime(), to:now.getTime() }; }
    case '3m': { const d=new Date(now); d.setMonth(d.getMonth()-3); return { from:d.getTime(), to:now.getTime() }; }
    case '6m': { const d=new Date(now); d.setMonth(d.getMonth()-6); return { from:d.getTime(), to:now.getTime() }; }
    case '1y': { const d=new Date(now); d.setFullYear(d.getFullYear()-1); return { from:d.getTime(), to:now.getTime() }; }
    case 'all': return { from:-Infinity, to:now.getTime() };
    case 'custom': {
      const f = wrappedSettings.customFrom ? new Date(wrappedSettings.customFrom+'T00:00:00').getTime() : todayStart;
      const t = wrappedSettings.customTo ? new Date(wrappedSettings.customTo+'T23:59:59').getTime() : now.getTime();
      return { from:f, to:t };
    }
    default: return { from: now.getTime()-30*86400000, to: now.getTime() };
  }
}
function renderWrappedView(){
  const ws = wrappedSettings;
  const cur = current();
  const chips = WRAP_PRESETS.map(p => `<button class="chip ${ws.interval===p.id?'active':''}" onclick="setWrapInterval('${p.id}')">${p.label}</button>`).join('');
  const customDates = ws.interval==='custom' ? `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
      <div><label class="lbl">Du</label><input type="date" class="inp" id="wrap-from" value="${ws.customFrom}" onchange="setWrapCustom('from',this.value)"></div>
      <div><label class="lbl">Au</label><input type="date" class="inp" id="wrap-to" value="${ws.customTo}" onchange="setWrapCustom('to',this.value)"></div>
    </div>` : '';
  const kwSamples = ['bus','salaire','courses','resto','sncf','loyer'];
  return `
  <div class="view-anim">
  <div class="card">
    <h2 class="card-title"><span class="em">🎁</span> Mon Wrapped</h2>
    <p class="muted" style="margin:-6px 0 12px">Ton bilan sur la période : dépenses, entrées, catégories… et recherche par mot-clé (ex : « bus » trouvera aussi « Bus 12 », « abonnement bus »…).</p>
    <label class="lbl">Périmètre</label>
    <div class="chip-row" style="margin-bottom:14px">
      <button class="chip ${ws.scope==='wallet'?'active':''}" onclick="setWrapScope('wallet')">👛 ${cur ? esc(cur.name) : 'Wallet'}</button>
      <button class="chip ${ws.scope==='all'?'active':''}" onclick="setWrapScope('all')">🌍 Tous les wallets</button>
    </div>
    <label class="lbl">Période</label>
    <div class="chip-row" style="flex-wrap:wrap">${chips}</div>
    ${customDates}
  </div>
  <div id="wrapped-results"></div>
  </div>`;
}
function setWrapInterval(p){ wrappedSettings.interval = p; persistUI(); renderView(); }
function setWrapScope(s){ wrappedSettings.scope = s; persistUI(); renderView(); }
function setWrapCustom(which, v){
  if (which==='from') wrappedSettings.customFrom = v;
  if (which==='to') wrappedSettings.customTo = v;
  persistUI(); computeWrapped();
}
function computeWrapped(){
  const box = document.getElementById('wrapped-results'); if (!box) return;
  const r = wrapRange();
  const txns = scopedTxns(wrappedSettings.scope);
  const d = buildWrapped(txns, r.from, r.to);
  wrappedData = { ...d, range:r };
  let html = '';
  if (!d.list.length){
    box.innerHTML = `<div class="card"><div class="empty"><span class="e">🎁</span>Aucune opération sur cette période.<br><span class="faint">Choisis une autre période ou ajoute des opérations.</span></div></div>`;
    return;
  }
  const fromLbl = isFinite(r.from) ? fmtDate(r.from) : 'Le début';
  const toLbl = fmtDate(r.to);
  const net = d.received - d.spent;
  html += `<div class="card wrap-hero" style="text-align:center">
    <div class="muted" style="font-weight:700">🎁 Wrapped Bankling — ${esc(fromLbl)} → <b>${esc(toLbl)}</b></div>
    <div style="font-size:34px;font-weight:800;margin:10px 0 2px;letter-spacing:-.02em;color:${net>=0?'var(--good)':'var(--bad)'}">
      <span class="tnum">${net>=0?'+':'−'}${fmtEUR(Math.abs(net))}</span></div>
    <div class="faint">Résultat net sur la période · ${d.n} opération${d.n>1?'s':''}</div>
  </div>
  <div class="card">
    <div class="wrap-grid">
      <div class="wrap-cell"><div class="k">💸 Dépensé</div><div class="v tnum" style="color:var(--bad)">−${fmtEUR(d.spent)}</div><div class="s">${d.nSpent} dépense${d.nSpent>1?'s':''}</div></div>
      <div class="wrap-cell"><div class="k">🪙 Reçu</div><div class="v tnum" style="color:var(--good)">+${fmtEUR(d.received)}</div><div class="s">${d.nRecv} entrée${d.nRecv>1?'s':''}</div></div>
      <div class="wrap-cell"><div class="k">📅 Moyenne / jour</div><div class="v tnum">${fmtEUR(d.avgPerDay)}</div><div class="s">sur ${d.days} jour${d.days>1?'s':''}</div></div>
      <div class="wrap-cell"><div class="k">🧾 Moyenne / dépense</div><div class="v tnum">${fmtEUR(d.avgTxn)}</div><div class="s">${d.nSpent} dépense${d.nSpent>1?'s':''}</div></div>
    </div>
  </div>`;
  if (d.biggestExp) html += `<div class="card" style="display:flex;gap:12px;align-items:center">
      <div style="font-size:26px">💥</div>
      <div style="flex:1;min-width:0"><div class="muted" style="font-weight:700">Plus grosse dépense</div>
      <div style="font-weight:700;font-size:14px">${esc(d.biggestExp.label || d.biggestExp.type)} <span class="faint">· ${fmtDate(d.biggestExp.timestamp)}</span></div></div>
      <div class="tnum" style="font-weight:800;color:var(--bad)">−${fmtEUR(Math.abs(d.biggestExp.amount))}</div></div>`;
  if (d.biggestInc) html += `<div class="card" style="display:flex;gap:12px;align-items:center">
      <div style="font-size:26px">🎉</div>
      <div style="flex:1;min-width:0"><div class="muted" style="font-weight:700">Plus gros dépôt</div>
      <div style="font-weight:700;font-size:14px">${esc(d.biggestInc.label || d.biggestInc.type)} <span class="faint">· ${fmtDate(d.biggestInc.timestamp)}</span></div></div>
      <div class="tnum" style="font-weight:800;color:var(--good)">+${fmtEUR(d.biggestInc.amount)}</div></div>`;
  if (d.topDay) html += `<div class="card" style="display:flex;gap:12px;align-items:center">
      <div style="font-size:26px">🔥</div>
      <div style="flex:1;min-width:0"><div class="muted" style="font-weight:700">Jour le plus dépensier</div>
      <div style="font-weight:700;font-size:14px;text-transform:capitalize">${fmtDayFull(new Date(d.topDay.date).getTime())}</div></div>
      <div class="tnum" style="font-weight:800;color:var(--bad)">−${fmtEUR(Math.abs(d.topDay.total))}</div></div>`;
  // catégories
  if (d.catRank.length){
    const max = Math.abs(d.catRank[0].total) || 1;
    html += `<div class="card"><h2 class="card-title"><span class="em">🏷️</span> Top catégories de dépenses</h2>` +
      d.catRank.map(c => {
        const cat = appState.categories.find(x=>x.id===c.catId) || { emoji:'✨', name:'Autre' };
        return `<div class="bar-row"><div class="bar-top"><span>${cat.emoji} ${esc(cat.name)} <span class="faint">×${c.count}</span></span>
        <span class="tnum" style="color:var(--bad)">−${fmtEUR(Math.abs(c.total))}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4, Math.abs(c.total)/max*100).toFixed(1)}%"></div></div></div>`;
      }).join('') + `</div>`;
  }
  // recherche mot-clé
  const kwSamples = ['bus','salaire','courses','resto','loyer'];
  html += `<div class="card">
    <h2 class="card-title"><span class="em">🔍</span> Cherche un thème</h2>
    <p class="muted" style="margin:-6px 0 10px">La recherche est approximative : « bus » trouvera aussi « BUS », « bus 12 », « abonnement bus »…</p>
    <div style="display:flex;gap:8px">
      <input id="wrap-kw" class="inp" placeholder="Ex : bus, école, sncf…" style="flex:1">
      <button class="btn btn-primary" onclick="doKwSearch()">Chercher</button>
    </div>
    <div class="chip-row" style="margin-top:10px">${kwSamples.map(k=>`<button class="chip" onclick="quickKw('${k}')">${k}</button>`).join('')}</div>
    <div id="kw-results"></div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-ghost" style="flex:1" onclick="copyWrapped()">📋 Copier</button>
    <button class="btn btn-primary" style="flex:1" onclick="shareWrapped()">📤 Partager</button>
  </div>
  <p class="faint" style="text-align:center;margin-top:10px;font-size:11px">Wrapped généré le ${new Date().toLocaleDateString('fr-FR')} · Bankling v4</p>`;
  box.innerHTML = html;
  const kwSaved = wrappedData._kw || '';
  if (kwSaved) quickKw(kwSaved);
}
function quickKw(k){
  document.getElementById('wrap-kw').value = k;
  doKwSearch();
}
function doKwSearch(){
  const kw = (document.getElementById('wrap-kw').value || '').trim();
  const box = document.getElementById('kw-results'); if (!box || !wrappedData) return;
  wrappedData._kw = kw || null;
  if (!kw){ box.innerHTML = ''; return; }
  const res = searchKeyword(wrappedData.list, kw, catNameOf);
  if (!res || !res.matches.length){
    box.innerHTML = `<div class="kw-res"><div class="head"><span>😶 Aucune correspondance pour « ${esc(kw)} »</span></div>
      <div class="muted" style="margin-top:4px">Essaie un mot plus court ou une autre orthographe.</div></div>`;
    return;
  }
  const spent = res.spent;
  box.innerHTML = `<div class="kw-res">
    <div class="head"><span>🔎 « ${esc(kw)} » — ${res.count} opération${res.count>1?'s':''}</span>
    <span class="tnum" style="color:${spent?'var(--bad)':'var(--good)'}">${spent ? '−'+fmtEUR(spent) : '+' + fmtEUR(res.total)}</span></div>
    <div style="margin-top:8px">${res.matches.slice(0,8).map(t=>`
      <div style="display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--border)">
        <span>${t.walletEmoji || ''}</span>
        <div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.label || t.type)}</div>
        <div class="faint" style="font-size:10.5px">${fmtDate(t.timestamp)}</div></div>
        <div class="tnum" style="font-weight:800;font-size:12.5px;color:${t.amount>=0?'var(--good)':'var(--bad)'}">${fmtSigned(t.amount)}</div>
      </div>`).join('')}</div>
    ${res.matches.length>8 ? `<div class="faint" style="text-align:center;margin-top:8px;font-size:11px">…et ${res.matches.length-8} autre(s)</div>` : ''}
  </div>`;
}
function wrappedText(){
  if (!wrappedData) return '';
  const d = wrappedData, net = d.received - d.spent;
  const fromLbl = isFinite(d.range.from) ? fmtDate(d.range.from) : 'le début';
  const lines = [
    '🎁 Bankling Wrapped',
    `📅 ${fromLbl} → ${fmtDate(d.range.to)}`,
    `💸 Dépensé : ${fmtEUR(d.spent)} (${d.nSpent} dépenses)`,
    `🪙 Reçu : +${fmtEUR(d.received)} (${d.nRecv} entrées)`,
    `📈 Net : ${net>=0?'+':'−'}${fmtEUR(Math.abs(net))}`,
    `🧾 ${d.n} opérations · moyenne ${fmtEUR(d.avgPerDay)}/jour`
  ];
  if (d.biggestExp) lines.push(`💥 Plus grosse dépense : ${d.biggestExp.label||d.biggestExp.type} (−${fmtEUR(Math.abs(d.biggestExp.amount))})`);
  if (d.topDay) lines.push(`🔥 Jour le plus dépensier : ${fmtDayFull(new Date(d.topDay.date).getTime())} (−${fmtEUR(Math.abs(d.topDay.total))})`);
  if (d.catRank.length){
    lines.push('🏷️ Top catégories :');
    d.catRank.slice(0,3).forEach(c => {
      const cat = appState.categories.find(x=>x.id===c.catId) || { name:'Autre' };
      lines.push(`   ${cat.name} — ${fmtEUR(Math.abs(c.total))}`);
    });
  }
  lines.push('— Fait avec Bankling 💜');
  return lines.join('\n');
}
async function copyWrapped(){
  const txt = wrappedText();
  try { await navigator.clipboard.writeText(txt); toast('📋 Wrapped copié !'); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); try { document.execCommand('copy'); toast('📋 Wrapped copié !'); } catch(e2){ toast('❌ Copie impossible'); }
    ta.remove();
  }
}
function shareWrapped(){
  if (navigator.share){ navigator.share({ title:'Mon Wrapped Bankling', text: wrappedText() }).catch(()=>{}); }
  else copyWrapped();
}

/* ============================================================
   VUE HISTORIQUE
   ============================================================ */
function txRow(t, showDelete){
  const catName = catNameOf(t.category), catEmoji = catEmojiOf(t.category);
  const cls = t.amount > 0 ? 'good' : (t.type === 'Ajustement' ? 'acc' : 'bad');
  return `<div class="tx-row">
    <div class="tx-emoji">${catEmoji}</div>
    <div class="tx-main">
      <div class="tx-label">${esc(t.label || t.type)}</div>
      <div class="tx-meta"><span class="tag ${cls}">${esc(t.type)}</span>${catName?`<span>${catEmoji} ${esc(catName)}</span>`:''}${t.walletEmoji?`<span>${t.walletEmoji}</span>`:''}</div>
    </div>
    <div class="tx-amount">
      <div class="a tnum" style="color:${t.amount>=0?'var(--good)':'var(--bad)'}">${fmtSigned(t.amount)}</div>
      <div class="d">${fmtDate(t.timestamp)} · ${fmtTime(t.timestamp)}</div>
    </div>
    ${showDelete ? `<button class="tx-del" onclick="deleteTx('${t.id}')" title="Supprimer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
    </button>` : ''}
  </div>`;
}
function deleteTx(id){
  confirmModal('Supprimer cette opération ?', 'Le solde du wallet sera mis à jour automatiquement. Cette action est irréversible.', 'Supprimer', ()=>{
    for (const w of walletList()){
      const i = w.transactions.findIndex(t=>t.id===id);
      if (i !== -1){ w.balance = Math.round((w.balance - w.transactions[i].amount)*100)/100; w.transactions.splice(i,1); break; }
    }
    saveData(); renderAll(); toast('🗑️ Opération supprimée');
  });
}
function renderHistoryView(){
  const hs = histSettings;
  const cur = current();
  const typeChips = [ ['all','Tous'], ['Dépôt','Dépôts'], ['Retrait','Retraits'], ['Ajustement','Ajustements'] ]
    .map(([id,l]) => `<button class="chip ${hs.type===id?'active':''}" onclick="setHist('type','${id}')">${l}</button>`).join('');
  const catOptions = appState.categories
    .map(c=>`<option value="${c.id}" ${hs.cat===c.id?'selected':''}>${c.emoji} ${esc(c.name)}</option>`).join('') +
    `<option value="none" ${hs.cat==='none'?'selected':''}>Sans catégorie</option>`;
  return `
  <div class="view-anim">
  <div class="card">
    <h2 class="card-title"><span class="em">🧾</span> Historique</h2>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <div style="flex:1;position:relative">
        <input id="hist-q" class="inp" style="padding-left:38px" placeholder="Recherche approximative…" value="${esc(hs.q)}" oninput="histSearch(this.value)">
        <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5">🔍</span>
      </div>
      <button class="icon-btn" style="flex:0 0 auto;width:48px" onclick="clearHistSearch()" title="Effacer la recherche">✕</button>
    </div>
    <div class="chip-row" style="margin-bottom:10px">${typeChips}</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <select class="select" onchange="setHist('cat', this.value)">
        <option value="all" ${hs.cat==='all'?'selected':''}>Toutes les catégories</option>
        ${catOptions}
      </select>
      <div class="seg">
        <button class="${hs.scope==='wallet'?'active':''}" onclick="setHist('scope','wallet')">👛 ${cur?esc(cur.name):''}</button>
        <button class="${hs.scope==='all'?'active':''}" onclick="setHist('scope','all')">🌍 Tous</button>
      </div>
    </div>
  </div>
  <div id="hist-list"></div>
  </div>`;
}
function histSearch(v){ histSettings.q = v; persistUI(); requestAnimationFrame(()=>renderHistList()); }
function clearHistSearch(){
  histSettings.q = '';
  const el = document.getElementById('hist-q'); if (el) el.value = '';
  persistUI(); renderHistList();
}
function setHist(which, v){
  if (which==='type') histSettings.type = v;
  if (which==='cat') histSettings.cat = v;
  if (which==='scope') histSettings.scope = v;
  persistUI(); renderHistList();
}
function renderHistList(){
  const box = document.getElementById('hist-list'); if (!box) return;
  const hs = histSettings;
  let txns = hs.scope==='all' ? allTxns() : walletList().filter(w=>w.id===appState.currentWallet).flatMap(w=>w.transactions.map(t=>({...t, walletEmoji:w.emoji})));
  if (hs.type !== 'all') txns = txns.filter(t=>t.type===hs.type);
  if (hs.cat === 'none') txns = txns.filter(t=>!t.category);
  else if (hs.cat !== 'all') txns = txns.filter(t=>t.category===hs.cat);
  if (hs.q) txns = txns.filter(t=>fuzzyMatch(t.label||'', hs.q) || fuzzyMatch(catNameOf(t.category)||'', hs.q) || fuzzyMatch(t.type, hs.q));
  txns = [...txns].sort((a,b)=>b.timestamp-a.timestamp);
  if (!txns.length){
    box.innerHTML = `<div class="card"><div class="empty"><span class="e">🔍</span>Aucune opération trouvée.<br><span class="faint">${hs.q ? 'Essaie un autre mot-clé.' : 'Ajoute des opérations depuis l\'onglet Portefeuille.'}</span></div></div>`;
    return;
  }
  let html = '<div class="card" style="padding:10px 16px">';
  let lastDay = null;
  txns.forEach(t => {
    const day = new Date(t.timestamp).toDateString();
    const daySpent = txns.filter(x=>new Date(x.timestamp).toDateString()===day && x.amount<0).reduce((s,x)=>s+x.amount,0);
    if (day !== lastDay){
      lastDay = day;
      html += `<div class="tx-group">${fmtDayFull(t.timestamp)} · ${txns.filter(x=>new Date(x.timestamp).toDateString()===day).length} op. · <span style="color:${daySpent?'var(--bad)':'var(--soft)'}">−${fmtEUR(Math.abs(daySpent))}</span></div>`;
    }
    html += txRow(t, true);
  });
  html += '</div>';
  box.innerHTML = html;
}
</script>

<script>
"use strict";
/* ============================================================
   Thèmes (palette)
   ============================================================ */
function openThemes(){
  const cur = appState.colorTheme;
  const rows = THEME_ORDER.map(id => `
    <button class="theme-swatch ${cur===id?'active':''}" onclick="changeTheme('${id}')">
      <span class="ts-dot" style="background:linear-gradient(135deg, ${THEME_CONFIG[id].bg1}, ${THEME_CONFIG[id].accent})"></span>
      ${THEME_LABELS[id]}
    </button>`).join('');
  showModal(`<button class="close-x" onclick="closeThemeModal()">✕</button>
    <h2>🎨 Palette de couleurs</h2>
    <p class="sub">L'interface entière change de couleur. Ton choix est sauvegardé.</p>${rows}`);
}
function closeThemeModal(){ closeModal(); }
function changeTheme(t){
  appState.colorTheme = t; applyTheme(); saveData(); renderTopbar(); closeThemeModal();
  toast(`🎨 Thème « ${THEME_LABELS[t]} » appliqué`);
}

/* ============================================================
   EXPORT / IMPORT
   ============================================================ */
function exportJSON(){
  return JSON.stringify({ version:4, exportedAt:new Date().toISOString(), currentWallet:appState.currentWallet,
    colorTheme:appState.colorTheme, categories:appState.categories, wallets:appState.wallets }, null, 2);
}
function openExport(){
  const json = exportJSON();
  showModal(`<button class="close-x" onclick="closeModal()">✕</button>
    <h2>📤 Exporter mes données</h2>
    <p class="sub">Fichier JSON v4 — il contient tout : wallets, opérations, catégories, thème.</p>
    <button class="btn btn-primary btn-block" onclick="downloadBackup()">⬇️ Télécharger le fichier</button>
    <button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="copyBackup()">📋 Copier le JSON</button>
    <details style="margin-top:14px"><summary class="muted" style="cursor:pointer">Voir le JSON</summary>
    <pre style="background:var(--bg1);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:10px;max-height:200px;overflow:auto;margin-top:8px">${esc(json)}</pre></details>`);
}
function downloadBackup(){
  const blob = new Blob([exportJSON()], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bankling-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast('💾 Backup téléchargé');
}
async function copyBackup(){
  try { await navigator.clipboard.writeText(exportJSON()); toast('📋 JSON copié dans le presse-papier !'); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = exportJSON();
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('📋 JSON copié !'); } catch(e2){ toast('❌ Copie impossible'); }
    ta.remove();
  }
}
function handleImportFile(ev){
  const f = ev.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { importData(JSON.parse(rd.result)); } catch(e){ toast('❌ Fichier JSON invalide'); } };
  rd.readAsText(f);
  ev.target.value = '';
}
function importData(d){
  if (isLegacyFormat(d)){ pendingLegacy = d; openLegacyImport({ fromStorage:false }); return; }
  if (d && d.version === 4 && d.wallets){
    showModal(`<button class="close-x" onclick="closeModal()">✕</button>
    <h2>📥 Importer un backup</h2>
    <p class="sub">Ce fichier contient ${Object.keys(d.wallets).length} wallet(s). Comment veux-tu l'importer ?</p>
    <button class="btn btn-primary btn-block" onclick="closeModal();mergeImport(d);toast('🔀 Backup fusionné !')">🔀 Fusionner avec l'existant</button>
    <button class="btn btn-bad btn-block" style="margin-top:10px" onclick="closeModal();replaceImport(d);toast('♻️ Données remplacées')">♻️ Remplacer toutes mes données</button>
    <button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="closeModal()">Annuler</button>`);
  } else toast('❌ Format de fichier non reconnu');
}
function mergeImport(d){
  // catégories
  (d.categories||[]).forEach(ic => { if (!appState.categories.some(c=>c.id===ic.id)) appState.categories.push(ic); });
  // wallets
  Object.values(d.wallets||{}).forEach(iw => {
    const w = appState.wallets[iw.id];
    if (!w){ appState.wallets[iw.id] = { id:iw.id, name:iw.name, emoji:iw.emoji, balance:iw.balance||0, transactions:[] }; }
    else { w.emoji = iw.emoji || w.emoji; w.name = iw.name || w.name; }
    const ww = appState.wallets[iw.id];
    const known = new Set(ww.transactions.map(t=>t.id));
    (iw.transactions||[]).forEach(t => { if (t && t.id && !known.has(t.id)) ww.transactions.push({ ...t, id:t.id }); });
    ww.balance = ww.transactions.length ? Math.round(ww.transactions.reduce((s,t)=>s+(t.amount||0),0)*100)/100 : (ww.balance);
  });
  if (!appState.currentWallet || !appState.wallets[appState.currentWallet]) appState.currentWallet = walletList()[0]?.id || null;
  saveData(); renderAll();
}
function replaceImport(d){
  appState = normalizeState({ version:4, currentWallet:d.currentWallet, colorTheme:d.colorTheme,
    categories:d.categories, wallets:d.wallets, ui:appState && appState.ui ? appState.ui : undefined });
  saveData(); renderAll();
}

/* ---------- Import ancienne version (v3 : card / cash / paypal) ---------- */
function isMappedAuto(oldKey, newWallets){
  const on = norm(LEGACY_NAMES[oldKey]);
  return newWallets.find(w => norm(w.name).includes(on.split(' ')[0]));
}
let legacyImportKeys = [];
function openLegacyImport(opts = {}){
  const legacy = pendingLegacy; if (!legacy) return;
  const keys = (Object.keys(legacy.accounts || {}).filter(k => legacy.accounts[k] && (legacy.accounts[k].balance !== 0 || (legacy.accounts[k].transactions||[]).length)));
  legacyImportKeys = keys.length ? keys : Object.keys(legacy.accounts || {});
  const newWallets = walletList();
  const rows = keys.map((k, i) => {
    const acc = legacy.accounts[k];
    const nbTx = (acc.transactions||[]).length;
    const auto = isMappedAuto(k, newWallets);
    return `<div class="mig-card">
      <div class="mig-old"><span style="font-size:22px">${LEGACY_EMOJI[k]}</span>
        <div style="flex:1"><div style="font-weight:800;font-size:14px">${LEGACY_NAMES[k]}</div>
        <div class="muted tnum">solde : ${fmtEUR(acc.balance)} · ${nbTx} opération${nbTx>1?'s':''}</div></div></div>
      <select class="select" id="mig-sel-${i}" onchange="migTargetChanged(${i})">
        <option value="new" ${!auto?'selected':''}>➕ Créer un nouveau wallet…</option>
        ${newWallets.map(w=>`<option value="${w.id}" ${auto&&auto.id===w.id?'selected':''}>${w.emoji} ${esc(w.name)}</option>`).join('')}
      </select>
      <div id="mig-new-${i}" style="margin-top:10px;${auto?'display:none':''}">
        <div style="display:flex;gap:8px">
          <input class="inp" id="mig-name-${i}" placeholder="Nom du nouveau wallet" maxlength="30" value="${LEGACY_NAMES[k]}" style="flex:1">
          <input class="inp" id="mig-emoji-${i}" style="width:64px;text-align:center" maxlength="4" value="${LEGACY_EMOJI[k]}">
        </div>
      </div>
    </div>`;
  }).join('');
  const title = opts.fromStorage
    ? '🕰️ Anciennes données détectées !'
    : '🕰️ Fichier d\'ancienne version détecté !';
  showModal(`<button class="close-x" onclick="closeModal();pendingLegacy=null;if(!walletList().length)openOnboarding()">✕</button>
    <h2>${title}</h2>
    <p class="sub">Ce fichier vient d'une ancienne version (wallets imposés : Carte Bleue, Espèces, PayPal).<br>
    <b>Les données sont conservées</b> (solde + opérations), mais toi seul choisis <b>dans quels nouveaux wallets</b> elles atterrissent — noms et emojis, c'est toi qui décides.</p>
    ${rows}
    ${!walletList().length ? `<p class="faint" style="font-size:11.5px">💡 Astuce : choisis « Créer un nouveau wallet » pour donner suite à l'onboarding, ou crée d'abord tes wallets.</p>` : ''}
    <button class="btn btn-good btn-block" style="margin-top:8px" onclick="applyLegacyImport()">✅ Importer les données</button>`,
    { dismissible:false });
}
function migTargetChanged(i){
  const sel = document.getElementById('mig-sel-' + i);
  const box = document.getElementById('mig-new-' + i);
  if (box) box.style.display = sel.value === 'new' ? '' : 'none';
}
function applyLegacyImport(){
  const legacy = pendingLegacy; if (!legacy) return;
  const keys = legacyImportKeys.length ? legacyImportKeys : Object.keys(legacy.accounts || {});
  let mapped = 0;
  const mapping = {};
  keys.forEach((k, i) => {
    const acc = legacy.accounts[k]; if (!acc) return;
    const sel = document.getElementById('mig-sel-' + i);
    let targetId = sel ? sel.value : 'new';
    if (targetId === 'new'){
      const name = (document.getElementById('mig-name-' + i)?.value || '').trim() || LEGACY_NAMES[k];
      const emoji = document.getElementById('mig-emoji-' + i)?.value.trim() || LEGACY_EMOJI[k];
      targetId = uid('w_');
      appState.wallets[targetId] = { id:targetId, name, emoji, balance:0, transactions:[] };
    }
    const w = appState.wallets[targetId]; if (!w) return;
    const txns = (acc.transactions || []).map(t => ({ id: uid('tx'), amount: t.amount, type: t.type, label: t.label || '', category: null, timestamp: t.timestamp ? new Date(t.timestamp).getTime() : Date.now() }));
    w.transactions.push(...txns);
    if (txns.length) w.balance = (w.balance || 0) + (acc.balance || 0);
    else if (acc.balance) { w.transactions.push({ id: uid('tx'), amount: acc.balance, type:'Ajustement', label:'Import ancienne version', category:null, timestamp: Date.now() }); w.balance = (w.balance||0) + acc.balance; }
    mapping[k] = targetId;
    mapped++;
  });
  const curOld = legacy.currentAccount;
  if (curOld && mapping[curOld] && appState.wallets[mapping[curOld]]) appState.currentWallet = mapping[curOld];
  else if (!appState.currentWallet || !appState.wallets[appState.currentWallet]) appState.currentWallet = walletList()[0]?.id || null;
  if (legacy.colorTheme && THEME_CONFIG[legacy.colorTheme]) appState.colorTheme = legacy.colorTheme;
  pendingLegacy = null;
  saveData(); closeModal(); applyTheme(); renderAll();
  toast(`✅ ${mapped} ancien(s) wallet(s) importé(s) — bienvenue dans la v4 !`);
}

/* ============================================================
   PWA — installation
   ============================================================ */
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('install-btn').style.display = 'grid';
});
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
function installApp(){
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(()=>{ deferredPrompt = null; document.getElementById('install-btn').style.display = 'none'; });
}

/* ============================================================
   INIT
   ============================================================ */
/* Les scripts sont en fin de <body> : le DOM est déjà prêt, on démarre directement. */
loadData();
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (document.activeElement?.id === 'op-amount' || document.activeElement?.id === 'op-label')) submitOp();
  if (e.key === 'Escape'){ closeDrawer(); if (walletList().length) closeModal(); }
});
</script>
