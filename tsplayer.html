<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tsplayer</title>
<style>
  :root{--brand:#FFA51F;--bg:#0d0f12;--panel:#171a1f;--line:#262b33;--txt:#e8eaed;--muted:#9aa0a6}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header img{height:34px;width:auto;max-width:52px;border-radius:6px;background:#000}
  header .t{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .live{background:#e53935;color:#fff;font-size:11px;font-weight:800;letter-spacing:1px;padding:3px 8px;border-radius:5px;display:none}
  .live.on{display:inline-block}
  #stage{position:relative;flex:1;background:#000;min-height:52vh}
  video{position:absolute;inset:0;width:100%;height:100%;background:#000}
  #ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
      background:rgba(8,10,12,.72);text-align:center;padding:20px}
  #ov.hide{display:none}
  #ov .big{font-size:17px;font-weight:700}
  #ov .sub{font-size:13px;color:var(--muted)}
  #playBtn,#retryBtn{background:var(--brand);border:0;color:#141414;font-weight:800;font-size:16px;
      padding:12px 26px;border-radius:12px;cursor:pointer}
  .spin{width:38px;height:38px;border:4px solid #333;border-top-color:var(--brand);border-radius:50%;
      animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #warn{display:none;background:#241a08;border:1px solid #6b4a10;color:#ffd9a0;margin:12px 16px 0;
      padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.5}
  #warn.show{display:block}
  #warn b{color:var(--brand)}
  #warn button{margin:8px 8px 0 0;background:var(--brand);border:0;padding:7px 12px;border-radius:8px;
      font-weight:700;cursor:pointer;color:#141414}
  #bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line)}
  #bar button{background:#22262d;color:var(--txt);border:1px solid var(--line);border-radius:8px;
      min-width:40px;height:36px;font-size:16px;cursor:pointer}
  #bar button:hover{border-color:var(--brand);color:var(--brand)}
  #vol{-webkit-appearance:none;appearance:none;width:110px;height:5px;background:#333;border-radius:4px;outline:0}
  #vol::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--brand);cursor:pointer}
  #state{font-size:12px;color:var(--muted);flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #hint{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:rgba(0,0,0,.8);
      color:#fff;padding:8px 14px;border-radius:9px;font-size:13px;display:none}
  footer{padding:6px 16px 12px;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<header>
  <img id="logo" alt="" hidden>
  <span class="t" id="name">tsplayer</span>
  <span class="live" id="badge">● DIRECT</span>
</header>

<div id="stage">
  <video id="v" playsinline></video>
  <div id="ov">
    <div class="spin" id="spin" hidden></div>
    <div class="big" id="ovTitle">Préparation…</div>
    <div class="sub" id="ovSub"></div>
    <button id="playBtn" hidden>▶　Lancer</button>
    <button id="retryBtn" hidden>↻ Réessayer</button>
  </div>
  <div id="hint">🔇 Cliquez pour activer le son</div>
</div>

<div id="warn"></div>

<div id="bar">
  <button id="bPlay" title="Lecture / pause (espace)">▶</button>
  <button id="bMute" title="Son (m)">🔇</button>
  <input type="range" id="vol" min="0" max="100" value="80" title="Volume">
  <button id="bPip" title="Picture-in-Picture">🗔</button>
  <button id="bFs" title="Plein écran (f)">⛶</button>
  <span id="state">initialisation…</span>
</div>
<footer id="foot">tsplayer</footer>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1/dist/mpegts.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const FLUX  = qs.get("flux")  || qs.get("url")   || "";
const NAME  = qs.get("fluxname") || qs.get("name") || "";
const LOGO  = qs.get("logourl")  || qs.get("logo") || "";

const v = $("v");
let engine = null;        // instance hls ou mpegts
let engineName = "—";
let kind = "native";      // hls | mpegts | native
let tries = 0, hintTimer = null, manualStop = false;
const MAX_TRIES = 6;

/* ---------- infos de la page (tout vient de l'URL) ---------- */
if (NAME) { $("name").textContent = NAME; document.title = NAME + " — tsplayer"; }
if (LOGO) { $("logo").src = LOGO; $("logo").hidden = false; }
if (!FLUX) {
  ovShow("Il manque le flux", "Utilisation : tsplayer.html?flux=<url-du-flux>&fluxname=<nom>&logourl=<logo>", null, false);
  setState("en attente d'un flux");
} else {
  $("foot").textContent = "tsplayer • " + FLUX;
}

/* ---------- mixed content : page https + flux http ---------- */
if (FLUX && location.protocol === "https:" && FLUX.startsWith("http:")) {
  const w = $("warn");
  w.innerHTML = "<b>Flux non chiffré (http) sur page sécurisée (https) :</b> Chrome/Edge bloquent ce "
    + "mélange. Solutions : ouvrir cette page en <b>http://</b> (hébergement local), utiliser "
    + "<b>Firefox</b> (cliquer le bouclier → désactiver la protection), ou servir le flux en https.";
  const bCopy = document.createElement("button"); bCopy.textContent = "📋 Copier le lien du flux";
  bCopy.onclick = () => navigator.clipboard.writeText(FLUX).then(() => bCopy.textContent = "✅ Copié !");
  const bOpen = document.createElement("button"); bOpen.textContent = "↗ Ouvrir le flux brut";
  bOpen.onclick = () => window.open(FLUX, "_blank");
  w.appendChild(bCopy); w.appendChild(bOpen); w.classList.add("show");
}

/* ---------- moteur selon le type de flux ---------- */
function pickKind() {
  const u = FLUX.toLowerCase().split("?")[0];
  if (u.endsWith(".m3u8")) return "hls";
  if (/\.(mp4|webm|mov|m4v)$/.test(u)) return "native";
  return "mpegts"; // flux live mpegts-over-http
}
if (FLUX) kind = pickKind();

function ovShow(title, sub, btn, spin) {
  $("ov").classList.remove("hide");
  $("ovTitle").textContent = title;
  $("ovSub").textContent = sub || "";
  $("playBtn").hidden = btn !== "play";
  $("retryBtn").hidden = btn !== "retry";
  $("spin").hidden = !spin;
}
function ovHide() { $("ov").classList.add("hide"); }
function setState(t) { $("state").textContent = t; }

function destroyEngine() {
  try { if (engine && engine.destroy) engine.destroy(); } catch (e) {}
  if (engine && engine.pause && engine.unload) { try { engine.pause(); engine.unload(); } catch (e) {} }
  engine = null; v.removeAttribute("src"); v.load();
}

function start() {
  if (!FLUX) return;
  manualStop = false;
  destroyEngine();
  $("badge").classList.toggle("on", kind !== "native");
  ovShow("Connexion au flux…", "", null, true);

  if (kind === "hls") {
    engineName = "hls.js";
    if (window.Hls && Hls.isSupported()) {
      engine = new Hls({ lowLatencyMode: false, maxLiveSyncPlaybackRate: 1.5 });
      engine.attachMedia(v);
      engine.loadSource(FLUX);
      engine.on(Hls.Events.MANIFEST_PARSED, () => tryPlay());
      engine.on(Hls.Events.ERROR, (_e, d) => { if (d.fatal) fail("flux interrompu"); });
    } else if (v.canPlayType("application/vnd.apple.mpegurl")) {
      engineName = "natif (HLS)"; v.src = FLUX; tryPlay();
    } else fail("moteur HLS indisponible");
  }
  else if (kind === "mpegts") {
    engineName = "mpegts.js";
    if (window.mpegts && mpegts.getFeatureList && mpegts.getFeatureList().mseLivePlayback) {
      engine = mpegts.createPlayer(
        { type: "mpegts", isLive: true, url: FLUX },
        { enableStashBuffer: false, liveBufferLatencyChasing: true, lazyLoad: false }
      );
      engine.attachMediaElement(v);
      engine.on(mpegts.Events.ERROR, () => fail("flux interrompu"));
      engine.load(); tryPlay();
    } else fail("moteur mpegts indisponible (CDN ?)");
  }
  else {
    engineName = "natif"; v.src = FLUX; tryPlay();
  }
  setState("moteur : " + engineName);
}

function tryPlay() {
  ovHide();
  v.muted = true;                       // politique autoplay des navigateurs
  const p = v.play();
  if (p && p.catch) p.catch(() => {
    ovShow("", "Cliquez pour lancer avec le son", "play", false);
  });
}

function scheduleRetry(reason) {
  if (manualStop) return;
  tries++;
  if (tries > MAX_TRIES) {
    ovShow("Impossible de lire ce flux", reason + " — vérifiez le lien, ou ouvrez-le dans un lecteur externe.", "retry", false);
    setState("échec");
    return;
  }
  const wait = Math.min(1.5 * Math.pow(1.6, tries - 1), 12);
  ovShow("Reconnexion… (" + tries + "/" + MAX_TRIES + ")", reason + " — nouvelle tentative dans " + Math.round(wait) + " s", null, true);
  setState("reconnexion " + tries + "/" + MAX_TRIES);
  setTimeout(() => { if (!manualStop) start(); }, wait * 1000);
}
function fail(reason) {
  if (v.networkState === 3 || v.readyState === 0 || kind !== "native") scheduleRetry(reason);
}

/* ---------- événements vidéo ---------- */
v.addEventListener("playing", () => {
  tries = 0; ovHide();
  setState("en direct • " + engineName);
  if (v.muted) {
    $("hint").style.display = "block";
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => $("hint").style.display = "none", 6000);
  }
});
v.addEventListener("waiting", () => setState("mise en mémoire…"));
v.addEventListener("pause",  () => { if (!v.ended) setState("en pause"); });

/* ---------- contrôles ---------- */
function togglePlay() {
  if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
  else { manualStop = true; v.pause(); manualStop = false; setState("en pause"); }
}
function toggleMute() {
  v.muted = !v.muted;
  $("bMute").textContent = v.muted ? "🔇" : "🔊";
  if (!v.muted) $("hint").style.display = "none";
}
$("bPlay").onclick = togglePlay;
$("bMute").onclick = toggleMute;
$("playBtn").onclick = () => { v.muted = false; $("bMute").textContent = "🔊"; tryPlay(); };
$("retryBtn").onclick = () => { tries = 0; start(); };
$("vol").oninput = e => { v.volume = e.target.value / 100; if (v.volume > 0 && v.muted) toggleMute(); };
$("bFs").onclick = () => {
  const st = $("stage");
  if (document.fullscreenElement) document.exitFullscreen();
  else (st.requestFullscreen ? st.requestFullscreen() : v.webkitEnterFullscreen && v.webkitEnterFullscreen());
};
$("bPip").onclick = async () => {
  try { document.pictureInPictureElement ? await document.exitPictureInPicture()
                                         : await v.requestPictureInPicture(); } catch (e) {}
};
v.addEventListener("click", () => { if (v.muted) toggleMute(); else togglePlay(); });
document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.key === "m") toggleMute();
  else if (e.key === "f") $("bFs").click();
});
window.addEventListener("beforeunload", () => { manualStop = true; destroyEngine(); });

/* ---------- GO ---------- */
if (FLUX) start();
</script>
</body>
</html>
